# ─────────────────────────────────────────────────────────────────────────────
# AWS RDS Aurora — IAM token authentication (no static password needed)
# The app generates a fresh IAM token automatically on startup and per connection.
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=rds-demo

# RDS connection config (used by RdsDataSourceConfig)
rds.host=database-sk.cluster-cxmamqkyqvnd.ap-south-1.rds.amazonaws.com
rds.port=5432
rds.dbname=postgres
rds.username=postgres
rds.region=ap-south-1

# HikariCP max-lifetime must be < IAM token TTL (15 min = 900000ms) → use 14 min
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=840000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' creates/alters tables automatically; use 'validate' or 'none' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator health endpoint (optional — useful for ALB/ECS health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
